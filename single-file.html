<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المزاج | برجر مشوي على الفحم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lalezar&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --char:#1a0d0d;
  --char2:#2a1414;
  --flame:#e2231a;
  --flame-dim:#a3160f;
  --mustard:#f4c430;
  --cream:#f5e6d3;
  --smoke:#3a1c1c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:calc(78px + env(safe-area-inset-top,0px));}
body{
  background:var(--char);
  color:var(--cream);
  font-family:'Tajawal',sans-serif;
  overflow-x:hidden;
  min-height:100%;
}
h1,h2,.brand{font-family:'Lalezar',cursive;}

/* ---------- NAV ---------- */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  display:flex;align-items:center;justify-content:flex-start;gap:12px;
  padding:16px 6vw;
  background:rgba(23,17,13,.85);
  backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(244,169,47,.15);
}
header .brand{font-size:1.6rem;color:var(--mustard);letter-spacing:1px;text-decoration:none;cursor:pointer;}
nav{display:flex;align-items:center;}
nav a{color:var(--cream);text-decoration:none;font-weight:700;margin-inline-start:22px;font-size:.95rem;opacity:.85;transition:opacity .2s, color .2s;}
nav a:hover, nav a:focus-visible{opacity:1;color:var(--flame);}
.cart-btn{
  background:var(--flame);color:var(--char);border:none;
  font-family:'Tajawal';font-weight:900;font-size:.95rem;
  padding:9px 16px;border-radius:20px;cursor:pointer;
  margin-inline-start:22px;display:flex;align-items:center;gap:6px;
  transition:transform .2s;
}
.cart-btn:hover, .cart-btn:focus-visible{transform:translateY(-2px);}
.cart-btn #cartCount{background:var(--char);color:var(--mustard);border-radius:50%;
  width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;}

/* ---------- HERO ---------- */
.hero{
  position:relative;
  min-height:88vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:8vh 6vw 6vh;
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 100%, rgba(255,90,31,.25), transparent 60%), var(--char);
}
.embers{position:absolute;inset:0;pointer-events:none;}
.ember{
  position:absolute;bottom:-10px;border-radius:50%;
  background:radial-gradient(circle, var(--mustard), var(--flame) 70%, transparent 100%);
  opacity:0;
  animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:0;}
  10%{opacity:.9;}
  100%{transform:translateY(-90vh) translateX(var(--drift,20px)) scale(.3);opacity:0;}
}
.hero-inner{position:relative;z-index:2;}
.eyebrow-flame{font-size:2.4rem;line-height:1;margin-bottom:4px;animation:flicker 2.4s ease-in-out infinite;display:inline-block;}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(-2deg);filter:brightness(1);}
  50%{transform:scale(1.08) rotate(2deg);filter:brightness(1.15);}
}
.hero h1{
  font-size:clamp(3.2rem,12vw,7rem);
  color:var(--cream);
  text-shadow:0 0 30px rgba(255,90,31,.5), 0 4px 0 var(--flame-dim);
  opacity:0;
  animation:sear 1.2s .3s cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes sear{
  0%{opacity:0;letter-spacing:.4em;filter:blur(8px);transform:scale(1.15);}
  100%{opacity:1;letter-spacing:normal;filter:blur(0);transform:scale(1);}
}
.hero p{
  max-width:520px;margin:18px auto 34px;
  color:var(--mustard);font-size:1.15rem;font-weight:500;
  opacity:0;animation:fadeUp .9s .9s ease forwards;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.cta{
  display:inline-block;background:var(--flame);color:var(--char);
  font-weight:900;font-size:1.05rem;padding:16px 42px;border-radius:6px;
  text-decoration:none;box-shadow:0 8px 24px rgba(255,90,31,.35);
  opacity:0;animation:fadeUp .9s 1.1s ease forwards;
  transition:transform .2s, box-shadow .2s;
  border:none;cursor:pointer;font-family:'Tajawal';
}
.cta:hover, .cta:focus-visible{transform:translateY(-3px);box-shadow:0 12px 28px rgba(255,90,31,.5);}

/* ---------- MENU ---------- */
.menu{padding:9vh 6vw;max-width:1100px;margin:0 auto;}
.menu h2{font-size:clamp(2rem,5vw,3rem);color:var(--mustard);margin-bottom:8px;}
.menu .sub{color:#c9baa9;margin-bottom:44px;font-size:1.05rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;}
.card{
  background:var(--char2);
  border:1px solid rgba(244,169,47,.12);
  border-radius:10px;
  padding:26px 22px;
  transition:transform .25s ease, border-color .25s ease, background .25s ease;
}
.card:hover, .card:focus-within{
  transform:translateY(-6px);
  border-color:var(--flame);
  background:linear-gradient(160deg,var(--char2), var(--smoke));
}
.card .icon{font-size:2.4rem;margin-bottom:14px;display:block;}
.card h3{font-family:'Tajawal';font-weight:900;font-size:1.25rem;color:var(--cream);margin-bottom:8px;}
.card p{color:#b9a996;font-size:.92rem;line-height:1.7;margin-bottom:14px;}
.card .row{display:flex;align-items:center;justify-content:space-between;}
.card .price{color:var(--flame);font-weight:900;font-size:1.15rem;}
.add-btn{
  background:transparent;border:1.5px solid var(--flame);color:var(--flame);
  font-family:'Tajawal';font-weight:700;font-size:.85rem;
  padding:7px 14px;border-radius:16px;cursor:pointer;
  transition:background .2s, color .2s, transform .15s;
}
.add-btn:hover, .add-btn:focus-visible{background:var(--flame);color:var(--char);}
.add-btn.added{transform:scale(1.05);background:var(--mustard);border-color:var(--mustard);color:var(--char);}

/* ---------- OFFERS ---------- */
.offers{padding:9vh 6vw;max-width:1100px;margin:0 auto;}
.offers h2{font-size:clamp(2rem,5vw,3rem);color:var(--mustard);margin-bottom:8px;}
.offers .sub{color:#c9a99a;margin-bottom:44px;font-size:1.05rem;}
.offer-card{
  background:linear-gradient(160deg, var(--char2), var(--smoke));
  border:1px solid rgba(244,196,48,.25);
  border-radius:10px;padding:24px 22px;
  transition:transform .25s ease, border-color .25s ease;
}
.offer-card:hover{transform:translateY(-6px);border-color:var(--mustard);}
.offer-card h3{color:var(--mustard);font-weight:900;font-size:1.15rem;margin-bottom:10px;}
.offer-card p{color:#dcc9bc;font-size:.92rem;line-height:1.7;margin-bottom:14px;}
.offer-price{color:var(--flame);font-weight:900;font-size:1.3rem;}

/* ---------- REVIEWS ---------- */
.reviews{padding:9vh 6vw;max-width:760px;margin:0 auto;}
.reviews h2{font-size:clamp(2rem,5vw,3rem);color:var(--mustard);margin-bottom:18px;text-align:center;}
.rating-summary{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:30px;}
.avg-stars{color:var(--mustard);font-size:1.5rem;letter-spacing:2px;}
#avgText{color:#c9a99a;font-size:.9rem;}
.review-form{
  display:flex;flex-direction:column;gap:12px;
  background:var(--char2);border:1px solid rgba(244,196,48,.15);
  border-radius:10px;padding:22px;margin-bottom:34px;
}
.review-form input, .review-form textarea{
  background:var(--char);border:1px solid rgba(244,196,48,.25);border-radius:6px;
  color:var(--cream);font-family:'Tajawal';font-size:.95rem;padding:10px 12px;resize:none;
}
.review-form input:focus, .review-form textarea:focus{outline:none;border-color:var(--mustard);}
.star-picker{display:flex;gap:6px;font-size:1.6rem;justify-content:center;}
.star-picker span{color:#5a4a42;cursor:pointer;transition:color .15s;}
.star-picker span.active{color:var(--mustard);}
.cta.small{padding:11px 0;font-size:.95rem;align-self:stretch;text-align:center;}
.review-list{display:flex;flex-direction:column;gap:14px;}
.review-card{background:var(--char2);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:16px 18px;}
.review-card .rline{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.review-card .rname{font-weight:900;color:var(--cream);}
.review-card .rstars{color:var(--mustard);letter-spacing:2px;}
.review-card .rcomment{color:#c9baa9;font-size:.92rem;line-height:1.7;}
.review-card .rdate{color:#7a6a5c;font-size:.75rem;margin-top:6px;}

/* ---------- STORY ---------- */
.story{
  background:rgba(58,28,28,.8);
  padding:9vh 6vw;
  display:grid;grid-template-columns:1fr;gap:26px;
  text-align:center;
}
.story h2{color:var(--flame);font-size:clamp(1.8rem,4.5vw,2.6rem);}
.story p{max-width:640px;margin:0 auto;color:var(--cream);font-size:1.08rem;line-height:2;opacity:.9;}

/* ---------- FOOTER ---------- */
footer{
  padding:6vh 6vw calc(4vh + env(safe-area-inset-bottom,0px));
  text-align:center;color:#8a7a68;font-size:.9rem;
  border-top:1px solid rgba(244,169,47,.1);
}
footer .brand{color:var(--mustard);font-size:1.3rem;display:block;margin-bottom:18px;}
.branches{display:flex;flex-wrap:wrap;justify-content:center;gap:32px;margin-bottom:20px;text-align:center;}
.branch h4{color:var(--flame);font-size:1rem;margin-bottom:6px;}
.branch p{color:#b9a99c;font-size:.9rem;max-width:220px;}
.phones{font-size:.95rem;}
.phones a{color:var(--mustard);text-decoration:none;font-weight:700;}
.phones a:hover{color:var(--flame);}

/* ---------- CART DRAWER ---------- */
.cart-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:90;
}
.cart-overlay.show{opacity:1;pointer-events:auto;}
.cart-drawer{
  position:fixed;top:0;bottom:0;left:0;
  width:min(360px,88vw);
  background:var(--char2);
  border-inline-end:1px solid rgba(244,196,48,.2);
  transform:translateX(-100%);
  transition:transform .35s ease;
  z-index:95;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.cart-drawer.open{transform:translateX(0);}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid rgba(244,196,48,.15);}
.cart-head h3{color:var(--mustard);font-family:'Tajawal';font-weight:900;font-size:1.2rem;}
.cart-close{background:none;border:none;color:var(--cream);font-size:1.2rem;cursor:pointer;}
.cart-items{flex:1;overflow-y:auto;padding:14px 20px;}
.cart-empty{color:#a99;font-size:.9rem;text-align:center;margin-top:30px;}
.cart-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.cart-line .name{font-weight:700;font-size:.95rem;color:var(--cream);}
.cart-line .sub{color:#b9a99c;font-size:.8rem;}
.qty-ctrl{display:flex;align-items:center;gap:8px;}
.qty-ctrl button{
  width:26px;height:26px;border-radius:50%;border:1px solid var(--flame);
  background:none;color:var(--flame);font-weight:900;cursor:pointer;
}
.qty-ctrl span{min-width:16px;text-align:center;font-weight:700;}
.cart-foot{padding:18px 20px;border-top:1px solid rgba(244,196,48,.15);}
.cart-total-row{display:flex;justify-content:space-between;color:var(--mustard);font-weight:900;font-size:1.15rem;margin-bottom:14px;}
.whatsapp-order-btn{
  display:block;width:100%;background:#25D366;color:#0a1a10;border:none;
  font-family:'Tajawal';font-weight:900;font-size:1rem;text-align:center;
  text-decoration:none;padding:14px;border-radius:8px;cursor:pointer;
  transition:transform .2s;
}
.whatsapp-order-btn:hover{transform:translateY(-2px);}

/* ---------- ORDER FORM (required fields) ---------- */
.order-form{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.order-form label{font-size:.8rem;color:#c9a99a;display:flex;flex-direction:column;gap:5px;}
.order-form input, .order-form textarea{
  background:var(--char);border:1px solid rgba(244,196,48,.25);border-radius:6px;
  color:var(--cream);font-family:'Tajawal';font-size:.92rem;padding:9px 10px;resize:none;
}
.order-form input:focus, .order-form textarea:focus{outline:none;border-color:var(--mustard);}
.order-form .invalid{border-color:var(--flame) !important;box-shadow:0 0 0 1px var(--flame);}

/* ---------- FLOATING CART BUBBLE ---------- */
.cart-float{
  position:fixed;bottom:24px;left:20px;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;
  background:var(--flame);border:none;color:var(--cream);
  font-size:1.5rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  cursor:pointer;z-index:80;
}
.cart-float-badge{
  position:absolute;top:-4px;right:-4px;
  background:var(--mustard);color:var(--char);
  min-width:20px;height:20px;border-radius:50%;
  font-size:.7rem;font-weight:900;font-family:'Tajawal';
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
header .cart-btn{display:none;}

/* ---------- FLOATING WHATSAPP BUTTON ---------- */
.wa-float{
  position:fixed;bottom:24px;right:20px;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;
  background:#25D366;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  z-index:80;
  animation:waPulse 2.6s ease-in-out infinite;
}
@keyframes waPulse{
  0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.4), 0 0 0 0 rgba(37,211,102,.5);}
  50%{box-shadow:0 6px 20px rgba(0,0,0,.4), 0 0 0 10px rgba(37,211,102,0);}
}

/* ---------- TOAST ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(150%);
  background:var(--mustard);color:var(--char);font-weight:900;
  padding:12px 26px;border-radius:24px;z-index:100;
  opacity:0;visibility:hidden;
  transition:transform .35s ease, opacity .35s ease, visibility 0s .35s;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;visibility:visible;
  transition:transform .35s ease, opacity .35s ease, visibility 0s;
}

@media (prefers-reduced-motion:reduce){
  .ember,.eyebrow-flame,.hero h1,.hero p,.cta{animation:none !important;opacity:1 !important;}
}


/* ---------- LANGUAGE SWITCH + ENGLISH TYPOGRAPHY ---------- */
.lang-btn{
  background:transparent;border:1.5px solid var(--mustard);color:var(--mustard);
  font-family:'Poppins','Tajawal',sans-serif;font-weight:700;font-size:.8rem;
  padding:5px 12px;border-radius:16px;cursor:pointer;flex-shrink:0;
  transition:background .2s, color .2s;
}
@media (hover:hover){.lang-btn:hover{background:var(--mustard);color:var(--char);}}
.lang-btn:focus-visible{background:var(--mustard);color:var(--char);}
.lang-btn[aria-expanded="true"]{background:rgba(244,196,48,.18);}
nav{min-width:0;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none;padding:3px 0;}
nav::-webkit-scrollbar{display:none;}
nav a, .cart-btn{white-space:nowrap;flex-shrink:0;}
html[lang="en"] body{font-family:'Poppins','Tajawal',sans-serif;}
html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] .brand{font-family:'Bebas Neue','Lalezar',cursive;letter-spacing:1.5px;}
html[lang="en"] :is(button, input, textarea, .card h3, .cart-head h3, .cta, .cart-float-badge){font-family:'Poppins','Tajawal',sans-serif;}
html[lang="en"] .hero p{font-weight:400;}
@media (max-width:640px){
  header{padding:12px 4vw;gap:8px;}
  header .brand{font-size:1.3rem;}
  nav a{margin-inline-start:14px;font-size:.85rem;}
}


/* ---------- LANGUAGE DROPDOWN ---------- */
.lang-wrap{position:relative;flex-shrink:0;}
.lang-btn{display:inline-flex;align-items:center;gap:6px;}
.lang-btn .caret{font-size:.7rem;opacity:.8;}
.lang-menu{
  position:absolute;top:calc(100% + 8px);inset-inline-start:0;min-width:140px;
  background:var(--char2);border:1px solid rgba(244,196,48,.3);border-radius:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);overflow:hidden;z-index:120;
  opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:opacity .2s ease, transform .2s ease, visibility 0s .2s;
}
.lang-menu.open{opacity:1;visibility:visible;transform:translateY(0);transition:opacity .2s ease, transform .2s ease, visibility 0s;}
.lang-menu button{
  display:block;width:100%;text-align:start;background:none;border:none;
  color:var(--cream);font-family:'Tajawal','Poppins',sans-serif;font-weight:700;font-size:.92rem;
  padding:11px 16px;cursor:pointer;transition:background .15s;
}
@media (hover:hover){.lang-menu button:hover{background:rgba(255,255,255,.07);}}
.lang-menu button:focus-visible{background:rgba(255,255,255,.07);}
.lang-menu button.active{color:var(--mustard);}
.lang-menu button.active::after{content:" ✓";}

/* ---------- MORE SPARKS ---------- */
.ember{box-shadow:0 0 6px rgba(255,140,40,.8);}

/* ---------- SLOW-SPINNING BURGERS ---------- */
.plain-zone{position:relative;overflow:hidden;}
.plain-zone > section{position:relative;z-index:1;}
.burger-bg{position:absolute;inset:0;z-index:0;pointer-events:none;}
.bg-burger{position:absolute;opacity:.17;animation:spinSlow linear infinite;will-change:transform;}
.bg-burger svg{width:100%;height:100%;display:block;}
@keyframes spinSlow{to{transform:rotate(360deg);}}

/* ---------- TOAST: black on top melting into orange ---------- */
.toast{
  background:linear-gradient(180deg,#050303 0%,#180505 30%,#7a0f0f 65%,#e2231a 100%);
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65);
  border-radius:18px;
  width:max-content;max-width:min(88vw,420px);text-align:center;line-height:1.5;
  bottom:calc(92px + env(safe-area-inset-bottom,0px));
}

@media (prefers-reduced-motion:reduce){
  .bg-burger{animation:none !important;}
}

/* ---------- ORDERABLE OFFERS ---------- */
.offer-card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* ---------- LET THE BURGERS SHOW THROUGH THE CARDS ---------- */
.card, .review-form, .review-card{background:rgba(42,20,20,.5);}
.card:hover, .card:focus-within{background:linear-gradient(160deg,rgba(42,20,20,.55),rgba(58,28,28,.55));}
.offer-card{background:linear-gradient(160deg,rgba(42,20,20,.5),rgba(58,28,28,.5));}
.story{background:rgba(58,28,28,.6);}
.bg-burger{opacity:.36;}
.lang-btn .globe{flex-shrink:0;}

/* ---------- REAL MENU ---------- */
.cat{font-weight:900;font-size:1.3rem;color:var(--cream);margin:40px 0 16px;padding-inline-start:12px;border-inline-start:4px solid var(--flame);}
#menuRoot > .cat:first-of-type{margin-top:0;}
.card .thumb{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;margin-bottom:14px;display:block;background:var(--flame-dim);}
.sizes{display:flex;gap:8px;margin-bottom:14px;}
.size-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:transparent;border:1.5px solid rgba(244,196,48,.3);color:var(--cream);
  border-radius:8px;padding:8px 4px;cursor:pointer;
  font-family:'Tajawal',sans-serif;font-size:.8rem;font-weight:700;
  transition:background .2s, border-color .2s;
}
.size-btn b{color:var(--mustard);font-size:.85rem;font-weight:900;}
.size-btn.active{background:var(--flame);border-color:var(--flame);color:#fff;}
.size-btn.active b{color:#fff;}
.add-btn.wide{width:100%;padding:10px 14px;}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
.mini{display:flex;align-items:center;gap:12px;background:rgba(42,20,20,.5);border:1px solid rgba(244,169,47,.12);border-radius:10px;padding:12px 14px;}
.mini .mn{flex:1;font-weight:700;}
.mini .price{color:var(--flame);font-weight:900;}
.mini-add{width:32px;height:32px;padding:0;border-radius:50%;font-size:1.1rem;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.mini .mi{font-size:1.4rem;width:40px;text-align:center;flex-shrink:0;}

const t = k => I18N[lang][k];
const num = n => lang === 'ar' ? Number(n).toLocaleString('ar-EG') : String(n);
const money = n => num(n) + ' ' + t('currency');

// ================= Best-seller tracking (counts adds on this device) =================
const COUNTS_KEY = 'mazaj_item_counts';
let itemCounts = {};
try{ itemCounts = JSON.parse(localStorage.getItem(COUNTS_KEY) || '{}'); }catch(err){ itemCounts = {}; }

function baseId(id){ return id.split(':')[0]; }

function trackAdd(id, qty){
  const bid = baseId(id);
  itemCounts[bid] = (itemCounts[bid] || 0) + qty;
  try{ localStorage.setItem(COUNTS_KEY, JSON.stringify(itemCounts)); }catch(err){}
}

function bestSellerId(){
  let top = null, max = 0;
  Object.entries(itemCounts).forEach(([id, n])=>{
    if(n > max){ max = n; top = id; }
  });
  return max > 0 ? top : null;
}

const MENU_BY_ID = Object.fromEntries(MENU.flatMap(g => g.items.map(i => [i.id, i])));
const menuRoot = document.getElementById('menuRoot');
const sel = {}; // chosen size per burger

function renderMenu(){
  menuRoot.innerHTML = MENU.map(g => {
    const body = g.items.map(it => {
      const nm = esc(it.name[lang]);
      if(g.type === 'mini'){
        return `<div class="mini">${it.img ? `<img class="mthumb" src="${it.img}" alt="">` : `<span class="mi">${it.icon}</span>`}<span class="mn">${nm}</span><span class="price">${money(it.price)}</span>` +
               `<button class="add-btn mini-add" data-id="${it.id}" data-price="${it.price}" aria-label="${t('add')}">+</button></div>`;
      }
      if(it.sizes){
        const cur = sel[it.id] || it.sizes[0][0];
        const pills = it.sizes.map(([k,p]) =>
          `<button class="size-btn${k === cur ? ' active' : ''}" data-item="${it.id}" data-size="${k}"><span>${SIZE_LABEL[k][lang]}</span><b>${money(p)}</b></button>`).join('');
        const badge = it.id === bestSellerId() ? `<span class="bestseller-badge">${t('bestseller')}</span>` : '';
        return `<div class="card">${badge}<img class="thumb" src="${it.img}" alt="${nm}" loading="lazy">` +
               `<h3>${nm}</h3><p>${esc(it.desc[lang])}</p><div class="sizes">${pills}</div>` +
               `<button class="add-btn wide" data-id="${it.id}">${t('add')}</button></div>`;
      }
      const badge2 = it.id === bestSellerId() ? `<span class="bestseller-badge">${t('bestseller')}</span>` : '';
      return `<div class="card">${badge2}${it.img ? `<img class="thumb" src="${it.img}" alt="${nm}" loading="lazy">` : `<span class="icon">${it.icon}</span>`}<h3>${nm}</h3>` +
             (it.desc ? `<p>${esc(it.desc[lang])}</p>` : '') +
             `<div class="row"><span class="price">${money(it.price)}</span>` +
             `<button class="add-btn" data-id="${it.id}" data-price="${it.price}">${t('add')}</button></div></div>`;
    }).join('');
    return `<h3 class="cat">${g.title[lang]}</h3><div class="${g.type === 'mini' ? 'mini-grid' : 'grid'}">${body}</div>`;
  }).join('');
}

}

// ================= Toast =================
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 2200);
}

// ================= Cart =================
let cart = []; // [{ id, price, qty }]
const cartCountEl = document.getElementById('cartCount');
const cartCountFloatEl = document.getElementById('cartCountFloat');
const cartItemsEl = document.getElementById('cartItems');
const cartTotalEl = document.getElementById('cartTotal');
const cartDrawer = document.getElementById('cartDrawer');
const cartOverlay = document.getElementById('cartOverlay');
const WHATSAPP_NUMBER = '201010157407';
const itemName = id => {
  if(/^o\d$/.test(id)) return t(id + '_t');
  const [base, size] = id.split(':');
  return MENU_BY_ID[base].name[lang] + (size ? ' — ' + SIZE_LABEL[size][lang] : '');
};
const hasTbd = () => cart.some(i => !i.price);
const totalStr = n => money(n) + (hasTbd() ? ' +' : '');

function addToCart(id, price, btn){
  const existing = cart.find(i => i.id === id);
  if(existing){ existing.qty++; } else { cart.push({ id, price, qty: 1 }); }
  trackAdd(id, 1);
  bumpCartIcons();
  btn.classList.add('added');
  const mini = btn.classList.contains('mini-add');
  btn.textContent = mini ? '✓' : t('added');
  setTimeout(()=>{ btn.classList.remove('added'); btn.textContent = mini ? '+' : t('add'); }, 1200);
  showToast(t('toast_added').replace('{n}', itemName(id)));
  renderCart();
  renderMenu();
}

function changeQty(id, delta){
  const item = cart.find(i => i.id === id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ cart = cart.filter(i => i.id !== id); }
  renderCart();
}

function renderCart(){
  const totalQty = cart.reduce((s,i)=> s+i.qty, 0);
  const totalPrice = cart.reduce((s,i)=> s + i.qty*i.price, 0);
  cartCountEl.textContent = totalQty;
  cartCountFloatEl.textContent = totalQty;
  cartTotalEl.textContent = totalStr(totalPrice);

  if(cart.length === 0){
    cartItemsEl.innerHTML = `<p class="cart-empty">${t('cart_empty')}</p>`;
    return;
  }
  cartItemsEl.innerHTML = cart.map(item => `
    <div class="cart-line">
      <div>
        <div class="name">${itemName(item.id)}</div>
        <div class="sub">${item.price ? money(item.price) + ' × ' + num(item.qty) : t('price_tbd') + ' × ' + num(item.qty)}</div>
      </div>
      <div class="qty-ctrl">
        <button data-action="dec" data-id="${item.id}">−</button>
        <span>${num(item.qty)}</span>
        <button data-action="inc" data-id="${item.id}">+</button>
      </div>
    </div>`).join('');

  cartItemsEl.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=> changeQty(b.dataset.id, b.dataset.action === 'inc' ? 1 : -1));
  });
}


function bumpCartIcons(){
  [document.getElementById('cartBtn'), document.getElementById('cartFloat')].forEach(el=>{
    el.classList.remove('bump');
    void el.offsetWidth; // restart animation
    el.classList.add('bump');
  });
}

function openCart(){ cartDrawer.classList.add('open'); cartOverlay.classList.add('show'); }
function closeCart(){ cartDrawer.classList.remove('open'); cartOverlay.classList.remove('show'); }

document.addEventListener('click', (e)=>{
  const sz = e.target.closest('.size-btn');
  if(sz){
    sel[sz.dataset.item] = sz.dataset.size;
    sz.parentElement.querySelectorAll('.size-btn').forEach(b=> b.classList.toggle('active', b === sz));
    return;
  }
  const b = e.target.closest('.add-btn');
  if(!b) return;
  let id = b.dataset.id, price = Number(b.dataset.price);
  const it = MENU_BY_ID[id];
  if(it && it.sizes){
    const k = sel[id] || it.sizes[0][0];
    id = id + ':' + k;
    price = it.sizes.find(x => x[0] === k)[1];
  }
  addToCart(id, price, b);
});
document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('cartFloat').addEventListener('click', openCart);
document.getElementById('cartClose').addEventListener('click', closeCart);
cartOverlay.addEventListener('click', closeCart);

// ================= Order via WhatsApp (required fields) =================
const whatsappOrderBtn = document.getElementById('whatsappOrderBtn');
const custName = document.getElementById('custName');
const custPhone = document.getElementById('custPhone');
const custAddress = document.getElementById('custAddress');

[custName, custPhone, custAddress].forEach(el=>{
  el.addEventListener('input', ()=> el.classList.remove('invalid'));
});
const digits = s => s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');

whatsappOrderBtn.addEventListener('click', (e)=>{
  if(cart.length === 0){
    e.preventDefault();
    showToast(t('toast_first'));
    return;
  }
  const name = custName.value.trim();
  const phone = custPhone.value.trim();
  const address = custAddress.value.trim();
  let firstInvalid = null;
  const check = (el, ok) => { el.classList.toggle('invalid', !ok); if(!ok && !firstInvalid) firstInvalid = el; };
  check(custName, name.length >= 3);
  check(custPhone, digits(phone).length >= 10);
  check(custAddress, address.length >= 8);

  if(firstInvalid){
    e.preventDefault();
    firstInvalid.focus();
    showToast(t('toast_invalid'));
    return;
  }

  const total = cart.reduce((s,i)=> s + i.qty*i.price, 0);
  let msg = t('wa_hello') + '\n\n';
  cart.forEach(i=>{ msg += i.price ? `- ${itemName(i.id)} × ${num(i.qty)} = ${money(i.qty*i.price)}\n` : `- ${itemName(i.id)} × ${num(i.qty)} (${t('price_tbd')})\n`; });
  msg += `\n${t('wa_total')}: ${totalStr(total)}\n\n`;
  msg += `${t('wa_name')}: ${name}\n${t('wa_phone')}: ${phone}\n${t('wa_addr')}: ${address}`;
  whatsappOrderBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
});

// ================= Reviews (stored per-device in localStorage) =================
const REVIEWS_KEY = 'mazaj_reviews';
let reviews = [];
try{ reviews = JSON.parse(localStorage.getItem(REVIEWS_KEY) || '[]'); }catch(err){ reviews = []; }

const starPicker = document.getElementById('starPicker');
const reviewForm = document.getElementById('reviewForm');
const revName = document.getElementById('revName');
const revComment = document.getElementById('revComment');
const reviewList = document.getElementById('reviewList');
const avgStars = document.getElementById('avgStars');
const avgText = document.getElementById('avgText');
let selectedStars = 0;

starPicker.querySelectorAll('span').forEach(s=>{
  s.addEventListener('click', ()=>{
    selectedStars = Number(s.dataset.v);
    starPicker.querySelectorAll('span').forEach(x=> x.classList.toggle('active', Number(x.dataset.v) <= selectedStars));
  });
});

const starString = n => '★★★★★☆☆☆☆☆'.slice(5-n, 10-n);
const fmtDate = r => r.ts ? new Date(r.ts).toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB') : (r.date || '');

function renderReviews(){
  if(reviews.length === 0){
    reviewList.innerHTML = '';
    avgStars.textContent = '☆☆☆☆☆';
    avgText.textContent = t('rev_none');
    return;
  }
  const avg = reviews.reduce((s,r)=> s+r.stars, 0) / reviews.length;
  avgStars.textContent = starString(Math.round(avg));
  avgText.textContent = t('rev_avg').replace('{a}', num(avg.toFixed(1))).replace('{c}', num(reviews.length));
  reviewList.innerHTML = reviews.slice().reverse().map(r => `
    <div class="review-card">
      <div class="rline"><span class="rname">${esc(r.name)}</span><span class="rstars">${starString(r.stars)}</span></div>
      <p class="rcomment">${esc(r.comment)}</p>
      <div class="rdate">${fmtDate(r)}</div>
    </div>`).join('');
}

reviewForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  const name = revName.value.trim();
  const comment = revComment.value.trim();
  if(name.length < 2 || selectedStars === 0 || comment.length < 2){
    showToast(t('toast_rev_invalid'));
    return;
  }
  reviews.push({ name, stars: selectedStars, comment, ts: Date.now() });
  try{ localStorage.setItem(REVIEWS_KEY, JSON.stringify(reviews)); }catch(err){}
  revName.value = ''; revComment.value = ''; selectedStars = 0;
  starPicker.querySelectorAll('span').forEach(x=> x.classList.remove('active'));
  renderReviews();
  showToast(t('toast_thanks'));
});

// ================= Apply language =================
const langBtn = document.getElementById('langBtn');
const langMenu = document.getElementById('langMenu');
const langLabel = document.getElementById('langLabel');

function setLangMenu(open){
  langMenu.classList.toggle('open', open);
  langBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el=> el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=> el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=> el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('.js-price').forEach(el=> el.textContent = money(el.dataset.price));
  langLabel.textContent = lang === 'ar' ? 'العربية' : 'English';
  langMenu.querySelectorAll('button').forEach(b=> b.classList.toggle('active', b.dataset.lang === lang));
  renderMenu();
  renderCart();
  renderReviews();
}

langBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  setLangMenu(!langMenu.classList.contains('open'));
});
langMenu.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click', ()=>{
    lang = b.dataset.lang;
    try{ localStorage.setItem('mazaj_lang', lang); }catch(err){}
    applyLang();
    setLangMenu(false);
  });
});
document.addEventListener('click', ()=> setLangMenu(false));
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') setLangMenu(false); });
applyLang();

// ================= Slow-spinning cartoon burgers behind plain sections =================
const burgerBg = document.getElementById('burgerBg');
const plainZone = document.getElementById('plainZone');
function spawnBurgers(){
  burgerBg.innerHTML = '';
  const n = Math.max(24, Math.round(plainZone.offsetHeight / 100));
  const bands = [[2,30],[36,64],[70,96]];
  for(let i=0;i<n;i++){
    const size = 14 + Math.random()*14;
    const b = bands[i % 3];
    const d = document.createElement('div');
    d.className = 'bg-burger';
    d.style.width = d.style.height = size + 'px';
    d.style.top = ((i + 0.15 + Math.random()*0.7) / n * 100) + '%';
    d.style.left = (b[0] + Math.random()*(b[1]-b[0])) + '%';
    d.style.animationDuration = (12 + Math.random()*14) + 's';
    d.style.animationDirection = Math.random() < 0.5 ? 'normal' : 'reverse';
    d.style.animationDelay = (-Math.random()*20) + 's';
    d.innerHTML = '<svg viewBox="0 0 64 64"><use href="#burgerIcon"/></svg>';
    burgerBg.appendChild(d);
  }
}
spawnBurgers();
window.addEventListener('load', spawnBurgers);

</script>
